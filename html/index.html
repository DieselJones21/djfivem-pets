<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kennel</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app" class="hidden" aria-hidden="true">
        <section class="panel" role="dialog" aria-labelledby="pet-name">
            <header class="panel-head">
                <div class="profile">
                    <div id="badge" class="avatar"><span id="badge-glyph">RT</span></div>
                    <div class="who">
                        <h1 id="pet-name">Buddy</h1>
                        <p class="rank"><span id="pet-meta">Rottweiler</span> · <span id="pet-level">Lv 1</span></p>
                    </div>
                </div>
                <button id="btn-close" class="icon-btn" type="button" aria-label="Close">×</button>
            </header>

            <nav id="pet-switcher" class="nav-pills" aria-label="Your pets"></nav>

            <div class="stat-grid" id="stats"></div>

            <section class="overview">
                <div class="overview-head">
                    <h2>Actions</h2>
                    <div class="seg" id="chips"></div>
                </div>
                <p id="hint" class="hint"></p>
                <div class="action-nav" id="actions"></div>
            </section>

            <footer class="foot">
                <span class="kbd">F6</span>
                Minimize menu
            </footer>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
