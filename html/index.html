<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kennel</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app" class="hidden" aria-hidden="true">
        <section class="panel" role="dialog" aria-labelledby="pet-name">
            <header class="panel-head">
                <div class="identity">
                    <div id="badge" class="badge"><span id="badge-glyph">RT</span></div>
                    <div class="who">
                        <h1 id="pet-name">Buddy</h1>
                        <p id="pet-meta" class="meta">Rottweiler · 4 days</p>
                    </div>
                </div>
                <div class="head-right">
                    <span id="pet-level" class="level">Lv 1</span>
                    <button id="btn-close" class="icon-btn" type="button" aria-label="Close">×</button>
                </div>
            </header>

            <nav id="pet-switcher" class="switcher" aria-label="Your pets"></nav>

            <ul class="chips" id="chips"></ul>

            <div class="stats" id="stats"></div>
            <div class="bond-row">
                <span>Bond</span>
                <div class="bond-track"><div id="bond-fill" class="bond-fill"></div></div>
            </div>

            <p id="hint" class="hint"></p>
            <div class="actions" id="actions"></div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
