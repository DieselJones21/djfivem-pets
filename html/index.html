<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app" class="hidden" aria-hidden="true">
        <section class="panel kennel" role="dialog" aria-labelledby="pet-name">
            <header class="panel-head">
                <div class="profile">
                    <div id="badge" class="avatar">
                        <img id="badge-img" alt="" />
                        <span id="badge-glyph">CH</span>
                    </div>
                    <div class="who">
                        <p class="eyebrow" id="pet-rarity">Companion</p>
                        <h1 id="pet-name">Buddy</h1>
                        <p class="rank"><span id="pet-meta">Husky</span> · <span id="pet-level">Lv 1</span></p>
                    </div>
                </div>
                <button id="btn-close" class="icon-btn" type="button" aria-label="Close">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </header>

            <nav id="pet-switcher" class="pet-rail" aria-label="Your companions"></nav>

            <div class="status-row" id="chips"></div>

            <div class="stat-grid" id="stats"></div>

            <div class="bond" id="bond">
                <div class="bond-copy">
                    <span>Bond</span>
                    <strong id="bond-label">Lv 1 · 0/100</strong>
                </div>
                <div class="bond-track"><span id="bond-fill"></span></div>
            </div>

            <section class="overview">
                <div class="overview-head">
                    <h2>Care</h2>
                    <p id="hint" class="hint"></p>
                </div>
                <div class="action-nav" id="actions"></div>
            </section>

            <footer class="foot">
                <span class="kbd" id="menu-key">F6</span>
                <span id="age-label">Close menu</span>
            </footer>
        </section>
    </div>

    <div id="shop" class="hidden" aria-hidden="true">
        <section class="shop-shell" role="dialog" aria-labelledby="shop-title">
            <header class="shop-head">
                <div>
                    <p class="eyebrow">Los Santos</p>
                    <h1 id="shop-title">Companion Emporium</h1>
                </div>
                <div class="shop-tools">
                    <label class="search">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
                        <input id="shop-search" type="search" placeholder="Search companions" autocomplete="off" />
                    </label>
                    <button id="shop-close" class="icon-btn" type="button" aria-label="Close shop">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                    </button>
                </div>
            </header>
            <nav id="shop-cats" class="shop-cats" aria-label="Categories"></nav>
            <div id="shop-grid" class="shop-grid"></div>
            <aside id="shop-detail" class="shop-detail hidden"></aside>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
